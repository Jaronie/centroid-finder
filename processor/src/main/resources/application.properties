spring.application.name=centroidServer
# 8080 is already taken on this machine by an Apache/PHP server, so we use 8081.
server.port=8081

# ---------------------------------------------------------------------------
# Our own settings. These are the Spring Boot equivalent of Express's .env,
# and they get read by an @ConfigurationProperties(prefix="app") class.
# Relative paths resolve against the directory you launch the server from,
# which is server/ when you use `mvn spring-boot:run`.
# ---------------------------------------------------------------------------

# Directory of source videos. Also served statically at /videos/**.
app.videos-dir=./data/videos

# The processor jar. Built by `mvn package -Djavacpp.platform=linux-x86_64`
# in ../processor. The server launches this as a subprocess -- it never
# imports anything from it.
app.jar-path=../processor/target/centroidFinder.jar

# Where finished CSVs land. Also served statically at /results/**, which is
# what the "result" field of a done job points at.
app.results-dir=./data/results

# Cached first-frame JPEGs, so ffmpeg runs once per video instead of per request.
app.thumbnail-cache-dir=./data/thumbnails

# Resolved on PATH by default. Verified present at /usr/bin/ffmpeg on this machine.
app.ffmpeg-path=ffmpeg
